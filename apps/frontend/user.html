<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Zonas Azules - Conductor</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #eef2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .app-card { background: white; width: 100%; max-width: 420px; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { font-size: 1.4rem; color: #1a2a3a; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { font-size: 0.85rem; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    button { width: 100%; background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0056b3; }
    .ticket-card { background: #f8f9fa; border: 1px dashed #007bff; border-radius: 8px; padding: 15px; margin: 15px 0; text-align: center; }
    .amount { font-size: 1.8rem; font-weight: bold; color: #28a745; margin: 10px 0; }
    .hidden { display: none; }
    .alert-error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="app-card">
    <h1>🚙 Zonas Azules Manizales</h1>

    <!-- 1. Formulario de Autenticación -->
    <div id="auth-section">
      <div id="auth-error" class="alert-error hidden"></div>
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="******" required>
      </div>
      <button onclick="login()">Ingresar como Conductor</button>
    </div>

    <!-- 2. Búsqueda por Placa -->
    <div id="search-section" class="hidden">
      <p style="text-align: center; font-size: 0.9rem; color: #666;">Bienvenido: <b id="user-email"></b></p>
      <div class="form-group">
        <label>Número de Placa del Vehículo</label>
        <input type="text" id="plate-input" placeholder="Ej: MZL-999" style="text-transform: uppercase; font-size: 1.2rem; text-align: center; font-weight: bold;">
      </div>
      <button onclick="consultarPlaca()" style="background: #17a2b8;">Consultar Cobro</button>
    </div>

    <!-- 3. Liquidación y Pasarela de Pago -->
    <div id="payment-section" class="hidden">
      <div class="ticket-card">
        <span style="font-size: 0.85rem; color: #666;">Liquidación de Parqueo</span>
        <h2 id="ticket-spot" style="margin: 5px 0;">Celda: --</h2>
        <p id="ticket-zone" style="margin: 0; font-size: 0.9rem; color: #555;">Zona: --</p>
        <div class="amount" id="ticket-amount">$0 COP</div>
        <p style="font-size: 0.8rem; color: #888;">Tarifa oficial: $3.900 / Hora</p>
      </div>

      <button onclick="procesarPago()" style="background: #28a745; margin-bottom: 10px;">💳 Pagar y Liberar Espacio</button>
      <button onclick="cancelar()" style="background: #6c757d;">Volver</button>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    let activeSession = null;

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('auth-error');

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('user_token', data.token);
          document.getElementById('user-email').innerText = data.user.email;
          document.getElementById('auth-section').classList.add('hidden');
          document.getElementById('search-section').classList.remove('hidden');
        } else {
          errorDiv.innerText = data.error || 'Error al iniciar sesión';
          errorDiv.classList.remove('hidden');
        }
      } catch (e) {
        errorDiv.innerText = 'No se pudo conectar con el servidor';
        errorDiv.classList.remove('hidden');
      }
    }

    async function consultarPlaca() {
      const plate = document.getElementById('plate-input').value.trim().toUpperCase();
      if (!plate) return alert('Ingresa una placa válida');

      try {
        const res = await fetch(`${API_URL}/zones/coliseo/spots`);
        const celdas = await res.json();
        const celdaEncontrada = celdas.find(s => s.current_plate === plate);

        if (!celdaEncontrada) {
          return alert('No se encontró ningún parqueo activo con esa placa.');
        }

        activeSession = celdaEncontrada;
        document.getElementById('ticket-spot').innerText = `Celda: ${celdaEncontrada.spot_number}`;
        document.getElementById('ticket-zone').innerText = 'Zona: Coliseo Mayor';
        document.getElementById('ticket-amount').innerText = '$3.900 COP';

        document.getElementById('search-section').classList.add('hidden');
        document.getElementById('payment-section').classList.remove('hidden');
      } catch (e) {
        alert('Error al consultar la placa');
      }
    }

    async function procesarPago() {
      if (!activeSession) return;

      try {
        const res = await fetch(`${API_URL}/spots/release`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spot_id: activeSession.id })
        });

        if (res.ok) {
          alert('¡Pago procesado con éxito! Se ha liberado la celda.');
          document.getElementById('payment-section').classList.add('hidden');
          document.getElementById('search-section').classList.remove('hidden');
          document.getElementById('plate-input').value = '';
        } else {
          alert('Error al procesar el pago.');
        }
      } catch (e) {
        alert('Error en la transacción');
      }
    }

    function cancelar() {
      document.getElementById('payment-section').classList.add('hidden');
      document.getElementById('search-section').classList.remove('hidden');
    }
  </script>
</body>
</html>
