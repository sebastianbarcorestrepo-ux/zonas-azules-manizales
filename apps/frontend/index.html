<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zonas Azules - Manizales</title>
  
  <!-- Leaflet CSS (Mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    h1, h2 { color: #1a2a3a; text-align: center; margin-bottom: 10px; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    /* Contenedor del Mapa */
    #map { height: 350px; width: 100%; border-radius: 8px; margin-bottom: 20px; z-index: 1; }

    /* Tarjetas de Zonas */
    .zones-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .zone-card { background: #007bff; color: white; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
    .zone-card:hover, .zone-card.active { background: #0056b3; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    
    /* Seccion Celdas y Barra de Herramientas */
    .spots-section { border-top: 2px solid #e0e0e0; padding-top: 20px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .filter-group button { background: #e0e0e0; color: #333; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .filter-group button.active { background: #007bff; color: white; }
    .btn-add { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    /* Tarjeta de Recaudo Financiero */
    .revenue-bar { background: #1a2a3a; color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

    /* Tarjetas de Celdas */
    .grid-spots { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
    .spot-card { border-radius: 8px; padding: 15px; text-align: center; font-weight: bold; color: white; transition: 0.3s; position: relative; }
    .spot-card h3 { margin: 0 0 5px 0; font-size: 1.2rem; }
    .spot-card p { margin: 3px 0; font-size: 0.9rem; }
    .spot-card .plate-tag { background: rgba(0,0,0,0.25); border-radius: 4px; padding: 2px 6px; font-family: monospace; font-size: 0.85rem; display: inline-block; margin-top: 5px; }
    .available { background-color: #2e7d32; } /* Verde */
    .occupied { background-color: #c62828; }  /* Rojo */
    
    .controls { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
    button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-occupy { background: #d32f2f; color: white; }
    .btn-release { background: #388e3c; color: white; }

    /* Modal Formulario */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; width: 300px; text-align: center; }
    .modal-content input { width: 90%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🅿️ Zonas Azules Manizales</h1>
    
    <!-- Mapa de Manizales -->
    <div id="map"></div>

    <!-- Lista de Zonas -->
    <div id="zones-container" class="zones-grid">Cargando zonas...</div>

    <!-- Seccion Celdas -->
    <div class="spots-section">
      <h2 id="selected-zone-title">Selecciona una zona para ver sus celdas</h2>

      <!-- Tarjeta de Recaudo y Tarifa -->
      <div class="revenue-bar">
        <div>
          🏷️ Tarifa Carros: <span style="color: #ffc107; font-weight: bold;">$3.900 COP / Hora</span>
        </div>
        <div>
          💰 Recaudo Acumulado: <span id="total-revenue" style="color: #28a745; font-size: 1.1rem; font-weight: bold;">$0 COP</span> (<span id="total-sessions">0</span> cobros)
        </div>
      </div>

      <!-- Barra de Filtros y Crear Celda -->
      <div class="toolbar">
        <div class="filter-group">
          <button id="btn-filter-all" class="active" onclick="filtrarCeldas('all')">Todas</button>
          <button id="btn-filter-free" onclick="filtrarCeldas('available')">Libres</button>
          <button id="btn-filter-busy" onclick="filtrarCeldas('occupied')">Ocupadas</button>
        </div>
        <button class="btn-add" onclick="abrirModalNuevaCelda()">+ Nueva Celda</button>
      </div>

      <div id="spots-container" class="grid-spots">Elige una zona del mapa o de las tarjetas superiores.</div>

      <div class="controls" id="simulation-controls" style="display: none;">
        <button class="btn-occupy" onclick="simularOcupacion()">Simular Ocupación (COL-01)</button>
        <button class="btn-release" onclick="simularLiberacion()">Simular Liberación (COL-01)</button>
      </div>
    </div>
  </div>

  <!-- Modal para Crear Nueva Celda -->
  <div class="modal" id="modal-spot">
    <div class="modal-content">
      <h3>Agregar Celda</h3>
      <p id="modal-zone-name" style="font-weight: bold; color: #007bff;"></p>
      <input type="text" id="new-spot-number" placeholder="Ej: COL-05" />
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
        <button class="btn-add" onclick="guardarNuevaCelda()">Guardar</button>
        <button style="background: #6c757d; color: white;" onclick="cerrarModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS (Mapa) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_URL = 'http://localhost:3000/api';
    let map;
    let zonaActual = null;
    let intervalId = null;
    let filtroActual = 'all';
    let celdasCache = [];

    // Inicializar Mapa centrado en Manizales (Proveedor Esri 100% Libre)
    function initMap() {
      map = L.map('map').setView([5.0689, -75.5174], 14);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
      }).addTo(map);
    }

    // Cargar las zonas desde la API y colocar los pines en el mapa
    async function cargarZonas() {
      try {
        const res = await fetch(`${API_URL}/zones`);
        const zonas = await res.json();
        const container = document.getElementById('zones-container');
        container.innerHTML = '';

        zonas.forEach(zona => {
          const card = document.createElement('div');
          card.className = 'zone-card';
          card.id = `card-${zona.name.replace(/\s+/g, '-')}`;
          card.innerHTML = `
            <h3>${zona.name}</h3>
            <p>${zona.direccion || zona.address || ''}</p>
          `;
          card.onclick = () => seleccionarZona(zona);
          container.appendChild(card);

          if (zona.latitude && zona.longitude) {
            const marker = L.marker([parseFloat(zona.latitude), parseFloat(zona.longitude)]).addTo(map);
            marker.bindPopup(`<b>${zona.name}</b><br>${zona.direccion || zona.address || ''}`);
            marker.on('click', () => seleccionarZona(zona));
          }
        });

        const coliseo = zonas.find(z => z.name.toLowerCase().includes('coliseo')) || zonas[0];
        if (coliseo) seleccionarZona(coliseo);

      } catch (err) {
        console.error('Error al cargar zonas:', err);
      }
    }

    // Al hacer clic en una zona
    function seleccionarZona(zona) {
      zonaActual = zona;
      
      document.querySelectorAll('.zone-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${zona.name.replace(/\s+/g, '-')}`);
      if (activeCard) activeCard.classList.add('active');

      if (zona.latitude && zona.longitude) {
        map.flyTo([parseFloat(zona.latitude), parseFloat(zona.longitude)], 17, { duration: 1.5 });
      }

      const isColiseo = zona.name.toLowerCase().includes('coliseo');
      document.getElementById('simulation-controls').style.display = isColiseo ? 'flex' : 'none';

      cargarCeldas(zona.name);
      cargarRecaudo(zona.name);

      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(() => {
        cargarCeldas(zona.name);
        cargarRecaudo(zona.name);
      }, 3000);
    }

    // Consultar recaudo acumulado por zona
    async function cargarRecaudo(nombreZona) {
      try {
        const res = await fetch(`${API_URL}/zones/${nombreZona}/revenue`);
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('total-revenue').innerText = `$${parseInt(data.total_revenue || 0).toLocaleString('es-CO')} COP`;
        document.getElementById('total-sessions').innerText = data.total_sessions || 0;
      } catch (err) {
        console.error('Error al cargar recaudo:', err);
      }
    }

    // Consultar celdas de la zona
    async function cargarCeldas(nombreZona) {
      try {
        const res = await fetch(`${API_URL}/zones/${nombreZona}/spots`);
        celdasCache = await res.json();
        
        const titleElement = document.getElementById('selected-zone-title');

        if (!Array.isArray(celdasCache) || celdasCache.length === 0) {
          titleElement.innerText = `Celdas - ${nombreZona} (Sin celdas registradas)`;
          document.getElementById('spots-container').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">Esta zona no tiene celdas registradas aún.</p>';
          return;
        }

        const ocupadas = celdasCache.filter(s => s.status === 'occupied').length;
        const libres = celdasCache.length - ocupadas;
        titleElement.innerText = `Celdas - ${nombreZona} (${libres} Libres / ${ocupadas} Ocupadas)`;

        renderizarCeldas();
      } catch (err) {
        console.error('Error al cargar celdas:', err);
      }
    }

    // Renderizar celdas aplicando el filtro activo
    function renderizarCeldas() {
      const container = document.getElementById('spots-container');
      container.innerHTML = '';

      const celdasFiltradas = celdasCache.filter(s => {
        if (filtroActual === 'available') return s.status === 'available';
        if (filtroActual === 'occupied') return s.status === 'occupied';
        return true;
      });

      if (celdasFiltradas.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">No hay celdas para este filtro.</p>';
        return;
      }

      celdasFiltradas.forEach(spot => {
        const card = document.createElement('div');
        const isOccupied = spot.status === 'occupied';
        card.className = `spot-card ${isOccupied ? 'occupied' : 'available'}`;
        
        let plateHTML = isOccupied && spot.current_plate ? `<div class="plate-tag">🚘 ${spot.current_plate}</div>` : '';

        card.innerHTML = `
          <h3>${spot.spot_number}</h3>
          <p>${isOccupied ? 'OCUPADO' : 'LIBRE'}</p>
          ${plateHTML}
        `;
        container.appendChild(card);
      });
    }

    // Filtrar celdas
    function filtrarCeldas(filtro) {
      filtroActual = filtro;
      document.querySelectorAll('.filter-group button').forEach(b => b.classList.remove('active'));
      if (filtro === 'all') document.getElementById('btn-filter-all').classList.add('active');
      if (filtro === 'available') document.getElementById('btn-filter-free').classList.add('active');
      if (filtro === 'occupied') document.getElementById('btn-filter-busy').classList.add('active');
      renderizarCeldas();
    }

    // Modal para nueva celda
    function abrirModalNuevaCelda() {
      if (!zonaActual) return alert("Selecciona una zona primero");
      document.getElementById('modal-zone-name').innerText = `Zona: ${zonaActual.name}`;
      document.getElementById('modal-spot').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modal-spot').style.display = 'none';
      document.getElementById('new-spot-number').value = '';
    }

    async function guardarNuevaCelda() {
      const spotNumber = document.getElementById('new-spot-number').value.trim();
      if (!spotNumber) return alert("Ingresa un número de celda");

      try {
        const res = await fetch(`${API_URL}/spots`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ zone_id: zonaActual.id, spot_number: spotNumber })
        });
        if (res.ok) {
          cerrarModal();
          cargarCeldas(zonaActual.name);
        } else {
          alert("Error al guardar la celda");
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function simularOcupacion() {
      if (celdasCache.length > 0) {
        await fetch(`${API_URL}/spots/occupy`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ spot_id: celdasCache[0].id, license_plate: 'MZL-999' })
        });
        cargarCeldas(zonaActual.name);
        cargarRecaudo(zonaActual.name);
      }
    }

    async function simularLiberacion() {
      if (celdasCache.length > 0) {
        await fetch(`${API_URL}/spots/release`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ spot_id: celdasCache[0].id })
        });
        cargarCeldas(zonaActual.name);
        cargarRecaudo(zonaActual.name);
      }
    }

    // Inicialización
    initMap();
    cargarZonas();
  </script>
</body>
</html>
